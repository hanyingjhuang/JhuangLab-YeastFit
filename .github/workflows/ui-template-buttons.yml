name: Validate template buttons

on:
  push:
    branches: [ui-template-buttons]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Unit and syntax checks
        run: |
          npm test
          npm run check
      - name: Install Chromium test runtime
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
      - name: Full browser regression suite
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/yeastfit-server.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          npm run test:browser
      - name: Verify template placement in every design card
        run: |
          node --input-type=module <<'EOF'
          import assert from 'node:assert/strict';
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1440,height:1000},acceptDownloads:true});
          await page.goto('http://127.0.0.1:4173',{waitUntil:'networkidle'});
          await page.waitForFunction(()=>window.YeastFitWorkflowV05&&window.YeastFitPresets);
          const ids=['daily','endpoint','screen','matrix','evolution','dose','competition','kinetic','manual'];
          assert.equal(await page.locator('#presetChooser #templateLibrary').count(),1,'template controls must live inside the design chooser');
          assert.equal(await page.locator('#templateLibrary > .preset-grid').count(),1,'design grid must remain intact');
          for(const id of ids){
            const card=page.locator(`#presetChooser .preset-card[data-preset="${id}"]`);
            assert.equal(await card.count(),1,`${id}: one design card`);
            assert.equal(await card.locator(`.template-download[data-template="${id}"]`).count(),2,`${id}: CSV and Excel buttons must be inside its design card`);
          }
          assert.equal(await page.locator('#templateLibrary .plate-map-template .template-download').count(),2,'plate-map CSV and Excel buttons');
          assert.equal(await page.locator('.step-panel[data-panel="1"] > .template-library').count(),0,'no separate template gallery should remain');
          const overflow=await page.evaluate(()=>document.documentElement.scrollWidth-document.documentElement.clientWidth);
          assert.ok(overflow<=6,`desktop horizontal overflow ${overflow}px`);
          await page.setViewportSize({width:390,height:844});
          await page.waitForTimeout(200);
          const mobileOverflow=await page.evaluate(()=>document.documentElement.scrollWidth-document.documentElement.clientWidth);
          assert.ok(mobileOverflow<=6,`mobile horizontal overflow ${mobileOverflow}px`);
          await browser.close();
          EOF
