name: Validate selective visual reports

on:
  push:
    branches: [plot-report-cleanup]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Apply final plot validity fixes
        run: node scripts/plot-cleanup-fixes.mjs
      - name: Unit and syntax checks
        run: |
          npm test
          npm run check
      - name: Install Chromium
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
      - name: Run all nine visual scenarios
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/yeastfit-server.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          node tests/plot-cleanup-smoke.mjs
      - name: Upload visual audit screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yeastfit-selective-visual-audit
          path: test-artifacts/plot-cleanup/
          if-no-files-found: warn
          retention-days: 3
      - name: Commit validated fixes
        if: success()
        run: |
          if git diff --quiet -- js/dashboard.js js/advanced.js; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/dashboard.js js/advanced.js
          git commit -m 'Finalize selective visual reports and factor-aware QC'
          git push
