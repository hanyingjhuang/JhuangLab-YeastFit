name: Validate YeastFit v0.7 comprehensive plots

on:
  push:
    branches: [v0.7-comprehensive-plots]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v0.7-comprehensive-plots
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Apply integration patch
        run: node scripts/apply-v07.mjs
      - name: Commit integration changes
        run: |
          if ! git diff --quiet; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add index.html package.json tests/browser-smoke.mjs
            git commit -m "Wire supplementary comprehensive plots"
            git push
          fi
      - name: Unit and syntax tests
        run: |
          npm test
          npm run check
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run browser suite
        run: |
          python3 -m http.server 4173 >/tmp/yeastfit-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          npm run test:browser
      - name: Verify supplementary plots
        run: |
          python3 -m http.server 4173 >/tmp/yeastfit-extra-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          cat > .tmp-check-extra.mjs <<'EOF'
          import assert from 'node:assert/strict';
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1440,height:1000}});
          const errors=[];
          page.on('pageerror',e=>errors.push(`pageerror: ${e.message}`));
          page.on('console',m=>{if(m.type()==='error')errors.push(`console: ${m.text()}`)});
          await page.goto('http://127.0.0.1:4173',{waitUntil:'networkidle'});
          await page.waitForFunction(()=>window.YeastFit&&window.YeastFitPresets);
          for(const preset of ['daily','screen','matrix','evolution','dose','competition','kinetic','manual']){
            await page.evaluate(p=>window.YeastFitPresets.loadDemo(p),preset);
            await page.waitForFunction(p=>window.YeastFit?.S?.design?.preset===p&&window.YeastFit.S.metrics?.length>0,preset);
            await page.waitForTimeout(700);
            const details=page.locator('#visualMoreAnalyses');
            if(await details.count()){
              const cards=await details.locator('.visual-card').count();
              assert.ok(cards>=1,`${preset} extra section must contain plots`);
              assert.ok(cards<=8,`${preset} extra section should remain curated`);
              await details.evaluate(el=>el.open=true);
              for(let i=0;i<cards;i++){
                const plot=details.locator('.visual-card').nth(i).locator('.visual-plot');
                await plot.locator('.main-svg').first().waitFor({state:'attached',timeout:8000});
                const health=await plot.evaluate(el=>({traces:el.data?.length||0,w:el.getBoundingClientRect().width,h:el.getBoundingClientRect().height}));
                assert.ok(health.traces>0,`${preset} supplementary card ${i} must have traces`);
                assert.ok(health.w>220&&health.h>180,`${preset} supplementary card ${i} must be legible`);
              }
            }
          }
          assert.deepEqual(errors,[],`browser errors: ${errors.join(' | ')}`);
          await browser.close();
          EOF
          node .tmp-check-extra.mjs
          rm .tmp-check-extra.mjs
