name: Validate data quality handling

on:
  push:
    branches: [data-quality-missing-contamination]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: data-quality-missing-contamination
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Unit and syntax tests
        run: |
          npm test
          npm run check
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Full browser validation
        run: |
          python3 -m http.server 4173 >/tmp/yeastfit-dq-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          npm run test:browser
          node tests/data-quality-ui-smoke.mjs
