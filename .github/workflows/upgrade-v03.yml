name: Apply YeastFit v0.3 upgrade

on:
  push:
    paths:
      - '.github/workflows/upgrade-v03.yml'

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Apply interface patch
        run: node scripts/apply-v03.mjs
      - name: Run tests
        run: npm test
      - name: Syntax checks
        run: npm run check
      - name: Commit upgrade
        run: |
          if git diff --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/app.js index.html package.json README.md
          git commit -m 'Expose experiment presets and comprehensive analyses'
          git push
